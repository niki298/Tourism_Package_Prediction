name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "tourism_project/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Validate dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v6
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v7
        with:
          name: registered-data
          path: tourism_project/data

      - name: Prepare train and test datasets
        run: python tourism_project/model_building/prep.py

      - name: Upload train and test splits
        uses: actions/upload-artifact@v6
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Download train and test splits
        uses: actions/download-artifact@v7
        with:
          name: data-splits
          path: .

      - name: Start MLflow server
        run: |
          nohup python -m mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri ./mlruns \
            --default-artifact-root ./mlartifacts \
            > mlflow_server.log 2>&1 &

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            cat mlflow_server.log
            exit 1
          fi

      - name: Train and evaluate model
        run: python -u tourism_project/model_building/train.py

      - name: Preserve experiment records and deployment files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: training-results
          path: |
            mlruns/
            mlartifacts/
            mlflow_server.log
            grid_search_results.csv
            threshold_comparison.csv
            tourism_project/deployment/best_tourism_package_model_v1.joblib
            tourism_project/deployment/model_config.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit model and configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            tourism_project/deployment/best_tourism_package_model_v1.joblib \
            tourism_project/deployment/model_config.json

          if git diff --cached --quiet; then
            echo "No model or configuration changes to commit."
          else
            git commit -m "Update trained tourism model and configuration [skip ci]"
            git push origin HEAD:main
          fi
